  - {client: Claude Code, config: ".mcp.json / claude mcp add --transport http embrace https://mcp.embrace.io/mcp", transport: http}
  - {client: Opencode, config: opencode.json, transport: remote}
second_mcp_surface:
  note: >-
    embrace.io (the WordPress marketing site) separately advertises a WordPress-plugin MCP
    resource at https://embrace.io/wp-json/mcp/mcp-oauth-server with a single "mcp" scope. It is
    a site-content surface, not the Embrace product API, and it also returns 401 anonymously.
    Recorded so the two are not conflated.
