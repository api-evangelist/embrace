apis:
- aid: embrace-metrics-api
  name: Embrace Metrics API
  description: >-
    A Prometheus-compatible read API for querying Embrace metrics with PromQL. Standard
    Embrace metrics and any Custom Metrics an organization has created are queryable across one
    app, several apps, or every app in the organization by filtering on app_id. Authenticated
    with the organization's Metrics API bearer token from Settings → Organization → API. Any
    PromQL client works against it — the docs ship Node (prometheus-query) and Python
    (prometheus-api-client) samples against the /api/v1 Prometheus HTTP API surface.
  humanURL: https://embrace.io/docs/metrics-forwarding/metrics-api/
  baseURL: https://api.embrace.io/metrics
  tags:
  - Metrics
  - PromQL
  - Prometheus
  - Observability
  - Monitoring
  properties:
  - type: Documentation
    url: https://embrace.io/docs/metrics-forwarding/metrics-api/
  - type: APIReference
    url: https://embrace.io/docs/metrics-forwarding/metrics-api/
  - type: Examples
    url: https://embrace.io/docs/metrics-forwarding/metrics-api/code-samples/
  - type: Authentication
    url: authentication/embrace-authentication.yml
- aid: embrace-custom-metrics-api
  name: Embrace Custom Metrics API
  description: >-
    A REST management API for creating, retrieving and deleting the custom metrics of an
    Embrace organization. A custom metric is defined from a base Embrace metric plus group_by
    dimensions, a filter tree, one or more time granularities (five_minute, hourly, daily) and a
    list of data destinations (metrics_api, newrelic, datadog, grafana_cloud). Authenticated with
    a dedicated Custom Metrics API bearer token issued by an Embrace onboarding specialist.
  humanURL: https://embrace.io/docs/metrics-forwarding/custom-metrics/custom-metrics-api/
  baseURL: https://api.embrace.io/custom-metrics
  tags:
  - Metrics
  - Custom Metrics
  - Observability
  - Management
  - Data Forwarding
  properties:
  - type: Documentation
    url: https://embrace.io/docs/metrics-forwarding/custom-metrics/custom-metrics-api/
  - type: APIReference
    url: https://embrace.io/docs/metrics-forwarding/custom-metrics/custom-metrics-api/
  - type: ErrorCatalog
    url: errors/embrace-problem-types.yml
  - type: Authentication
    url: authentication/embrace-authentication.yml
- aid: embrace-mcp-server
  name: Embrace MCP Server
  description: >-
    A hosted Model Context Protocol server over Streamable HTTP that exposes an Embrace
    organization's real-user observability data to MCP-capable AI assistants. Twenty-one published
    tools span apps, crashes, exceptions, logs, sessions, root spans and network domains and
    endpoints. Authentication is either an interactive OAuth 2.0 authorization-code flow with
    PKCE against dash-api.embrace.io, or a static service-account bearer token (emb_sa_ prefix)
    carrying the mcp:tools:call scope plus mcp:read and/or mcp:write.
  humanURL: https://embrace.io/docs/mcp/
  baseURL: https://mcp.embrace.io/mcp
  tags:
  - Model Context Protocol
  - MCP
  - Agents
  - Observability
  - AI
  properties:
  - type: MCPServer
    url: mcp/embrace-mcp.yml
  - type: Documentation
    url: https://embrace.io/docs/mcp/
  - type: OAuthScopes
    url: scopes/embrace-scopes.yml
