aid: embrace
name: Embrace
description: >-
  Embrace is a user-focused observability platform for mobile and web applications, built on
  OpenTelemetry. Its SDKs for iOS, Android, React Native, Flutter, Unity and the browser capture
  full-fidelity session, crash, exception, log, trace and network telemetry from real users, and
  the platform turns that into crash-free rates, user journeys, synthetics and custom dashboards.
  For programmatic access Embrace publishes a Prometheus-compatible Metrics API queried with
  PromQL, a Custom Metrics API for creating and managing derived metrics, OTLP forwarding to
  third-party destinations such as Datadog, Grafana Cloud, New Relic, Honeycomb, Elastic, Splunk,
  Chronosphere and Observe, outgoing alert webhooks, and a hosted Model Context Protocol server
  that exposes 21 read tools over crash, exception, log, span, session and network data to AI
  assistants using OAuth 2.0 or service-account bearer tokens.
