    - {surface: "Android SDK legacy integration path", docs: 'https://embrace.io/docs/android/legacy-integration/', status: legacy}
    - {surface: "iOS SDK 5.x", docs: 'https://embrace.io/docs/ios/5x/integration/', status: superseded-by-6x, migration_guide: 'https://embrace.io/docs/ios/6x/getting-started/migration-guide/'}
    - {surface: "React Native SDK 4.x", docs: 'https://embrace.io/docs/react-native/4x/integration/', status: superseded}
    - {surface: "Android moments API", docs: 'https://embrace.io/docs/android/features/moments/', status: superseded-by-traces}

