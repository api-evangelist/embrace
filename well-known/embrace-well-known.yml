description: >-
  Embrace serves a real RFC 8414 / RFC 9728 discovery surface in front of its MCP server:
  mcp.embrace.io publishes both oauth-authorization-server and oauth-protected-resource,
  and the issuer dash-api.embrace.io publishes its own authorization-server metadata plus
  a JWKS. Everything else 404s or is WAF-blocked. Two false positives were rejected and are
  recorded as such: dash.embrace.io answers 200 with the same 3,424-byte SPA shell for every
  path probed (including /.well-known/security.txt), and get.embrace.io / embrace.io return
  the marketing-site 404 template. No security.txt is served on any host.
hosts:
  - host: https://mcp.embrace.io
    documents:
      - path: /.well-known/oauth-authorization-server   # RFC 8414
        status: 200
        file: embrace-mcp-oauth-authorization-server.json
      - path: /.well-known/oauth-protected-resource     # RFC 9728
        status: 200
        file: embrace-mcp-oauth-protected-resource.json
      - path: /.well-known/openid-configuration
        status: 404
      - path: /.well-known/security.txt
        status: 404
